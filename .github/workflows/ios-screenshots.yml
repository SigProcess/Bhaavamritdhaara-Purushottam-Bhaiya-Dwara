name: iOS App Store Screenshots

# Captures App Store screenshots from the real app running in an iOS Simulator.
#
# Credential-free by design: the app is built unsigned for the simulator, nothing is uploaded to
# Apple, and no secret is read. Manual trigger only, so it never runs on a push or a pull request.
#
# The screenshots are published as a workflow artifact. Committing them into store-assets/ios/ is
# left to a human, so this workflow needs no write permission on the repository.

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Simulator device name to force (blank = auto-select an iPhone with Dynamic Island, medium display)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ios-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture App Store screenshots
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Record toolchain versions
        run: |
          set -euo pipefail
          sw_vers
          node --version
          npm --version
          ruby --version
          xcode-select --print-path
          xcodebuild -version

      - name: Resolve workspace paths
        # The `runner` context is not available in a job-level `env:` block, so every derived path
        # is computed in a step and exported through $GITHUB_ENV.
        run: |
          set -euo pipefail
          {
            echo "SCREENSHOT_WORK=$RUNNER_TEMP/screenshots"
            echo "SCREENSHOT_OUT=$RUNNER_TEMP/screenshots/final"
            echo "SCREENSHOT_RAW=$RUNNER_TEMP/screenshots/raw"
            echo "SCREENSHOT_LOGS=$RUNNER_TEMP/screenshots/logs"
            echo "DERIVED_DATA=$RUNNER_TEMP/screenshots/DerivedData"
            echo "RESULT_BUNDLE=$RUNNER_TEMP/screenshots/StoreScreenshots.xcresult"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/screenshots/final" "$RUNNER_TEMP/screenshots/raw" "$RUNNER_TEMP/screenshots/logs"

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: npm ci

      - name: Build web assets and sync iOS package
        # Reuses the sequence that `npm run release:readiness` already establishes
        # (catalog generation -> vite build with the release version -> cap sync ios -> package
        # validation). `--archive=skip` leaves out only the unsigned Release archive, which
        # .github/workflows/ios-cloud-build.yml already covers on every push.
        run: node scripts/prepare-ios-release.mjs --archive=skip

      - name: Select and boot a simulator
        env:
          REQUESTED_DEVICE: ${{ inputs.device }}
        run: |
          set -euo pipefail
          xcrun simctl list devices available

          # Preference order covers every device Apple lists under "iPhone with Dynamic Island
          # (medium display)" (1179x2556 or 1206x2622 portrait), newest first.
          SELECTION=$(xcrun simctl list devices available --json | node -e '
            const preferred = [
              "iPhone 18 Pro", "iPhone 17 Pro", "iPhone 16 Pro",
              "iPhone 17", "iPhone 16", "iPhone 15 Pro", "iPhone 15", "iPhone 14 Pro",
            ]
            const requested = (process.env.REQUESTED_DEVICE || "").trim()
            let raw = ""
            process.stdin.on("data", (chunk) => { raw += chunk })
            process.stdin.on("end", () => {
              const catalogue = JSON.parse(raw).devices ?? {}
              const available = []
              for (const [runtime, devices] of Object.entries(catalogue)) {
                for (const device of devices) {
                  if (device.isAvailable === false) continue
                  available.push({ name: device.name, udid: device.udid, runtime })
                }
              }
              const pick = requested
                ? available.find((device) => device.name === requested)
                : (preferred.map((name) => available.find((device) => device.name === name)).find(Boolean)
                   ?? available.find((device) => /^iPhone /.test(device.name)))
              if (!pick) {
                console.error(requested
                  ? `Requested simulator "${requested}" is not available. Available: ${available.map((d) => d.name).join(", ")}`
                  : "No usable iPhone simulator is available on this runner.")
                process.exit(1)
              }
              process.stdout.write([pick.udid, pick.name, pick.runtime].join("\t"))
            })
          ')
          UDID=$(printf '%s' "$SELECTION" | cut -f1)
          NAME=$(printf '%s' "$SELECTION" | cut -f2)
          RUNTIME=$(printf '%s' "$SELECTION" | cut -f3)
          echo "Selected simulator: $NAME ($UDID) on $RUNTIME"
          {
            echo "SIM_UDID=$UDID"
            echo "SIM_NAME=$NAME"
            echo "SIM_RUNTIME=$RUNTIME"
          } >> "$GITHUB_ENV"

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light || true
          # Apple's own marketing convention for a clean status bar.
          xcrun simctl status_bar "$UDID" override \
            --time "9:41" \
            --dataNetwork wifi \
            --wifiMode active \
            --wifiBars 3 \
            --cellularMode active \
            --cellularBars 4 \
            --batteryState charged \
            --batteryLevel 100 || true

      - name: Inject the CI-only screenshot UI test target
        # The committed project.pbxproj is release-validated and holds exactly one target. This
        # mutation happens on the runner only and is never committed.
        run: |
          set -euo pipefail
          gem install xcodeproj --no-document --user-install
          RUBY_USER_BIN=$(ruby -e 'require "rubygems"; print Gem.user_dir')/bin
          export PATH="$RUBY_USER_BIN:$PATH"
          export GEM_HOME=$(ruby -e 'require "rubygems"; print Gem.user_dir')
          ruby scripts/ios-screenshot-project.rb
          xcodebuild -project ios/App/App.xcodeproj -list

      - name: Run the screenshot UI test
        id: uitest
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/App/App.xcodeproj \
            -scheme StoreScreenshots \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -only-testing:StoreScreenshotUITests/StoreScreenshotTests/testCaptureStoreScreenshots \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$SCREENSHOT_LOGS/xcodebuild-test.log"

      - name: Show the UI test navigation log
        if: always()
        run: |
          set -euo pipefail
          echo "::group::screenshot navigation log"
          grep -F '[screenshots]' "$SCREENSHOT_LOGS/xcodebuild-test.log" || echo "no [screenshots] lines found"
          echo "::endgroup::"
          echo "::group::last 120 lines of xcodebuild output"
          tail -n 120 "$SCREENSHOT_LOGS/xcodebuild-test.log" || true
          echo "::endgroup::"

      - name: Collect captured images
        if: always()
        run: |
          set -euo pipefail

          # Primary path: attachments exported from the result bundle, which keep their names.
          if [ -d "$RESULT_BUNDLE" ]; then
            if xcrun xcresulttool export attachments \
                 --path "$RESULT_BUNDLE" \
                 --output-path "$SCREENSHOT_RAW" 2>"$SCREENSHOT_LOGS/xcresulttool.log"; then
              node -e '
                const { readFileSync, readdirSync, copyFileSync, existsSync } = require("node:fs")
                const { join } = require("node:path")
                const raw = process.env.SCREENSHOT_RAW
                const manifestPath = join(raw, "manifest.json")
                if (!existsSync(manifestPath)) {
                  console.log("no manifest.json in exported attachments:", readdirSync(raw).join(", "))
                  process.exit(0)
                }
                const manifest = JSON.parse(readFileSync(manifestPath, "utf8"))
                const entries = Array.isArray(manifest) ? manifest : [manifest]
                let copied = 0
                for (const entry of entries) {
                  for (const attachment of entry.attachments ?? []) {
                    const from = join(raw, attachment.exportedFileName)
                    const name = attachment.suggestedHumanReadableName ?? attachment.exportedFileName
                    if (!existsSync(from)) continue
                    copyFileSync(from, join(raw, name))
                    console.log(`attachment ${name}`)
                    copied += 1
                  }
                }
                console.log(`${copied} attachment(s) named from manifest`)
              '
            else
              echo "xcresulttool attachment export failed; see xcresulttool.log"
              cat "$SCREENSHOT_LOGS/xcresulttool.log" || true
            fi
          fi

          # Fallback path: the UI test also writes every PNG into the test runner's Documents
          # directory, which stays reachable from the host while the runner app is installed.
          CONTAINER=$(xcrun simctl get_app_container "$SIM_UDID" com.bhaavamrit.app.storescreenshots.xctrunner data 2>/dev/null || true)
          if [ -n "$CONTAINER" ] && [ -d "$CONTAINER/Documents/StoreScreenshots" ]; then
            echo "Recovering images from the runner container at $CONTAINER"
            for file in "$CONTAINER/Documents/StoreScreenshots"/*; do
              [ -e "$file" ] || continue
              base=$(basename "$file")
              [ -e "$SCREENSHOT_RAW/$base" ] || cp "$file" "$SCREENSHOT_RAW/$base"
            done
          else
            echo "Runner container unavailable (expected when xcodebuild uninstalled it)."
          fi

          # Host-side capture with simctl, used both as the supplementary home-screen shot and as
          # an independent check that an unrelated capture path yields the same pixel dimensions.
          xcrun simctl launch "$SIM_UDID" com.bhaavamrit.app || true
          sleep 12
          xcrun simctl io "$SIM_UDID" screenshot --type=png "$SCREENSHOT_RAW/06-home-simctl.png" || true
          xcrun simctl terminate "$SIM_UDID" com.bhaavamrit.app || true

          echo "::group::raw captures"
          ls -la "$SCREENSHOT_RAW"
          echo "::endgroup::"

      - name: Flatten alpha and verify against Apple's specification
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for file in "$SCREENSHOT_RAW"/*.png; do
            base=$(basename "$file")
            case "$base" in
              0[1-6]-*) ;;
              *) echo "skipping unexpected capture $base"; continue ;;
            esac
            swift scripts/flatten-png.swift "$file" "$SCREENSHOT_OUT/$base"
            found=$((found + 1))
          done
          cp "$SCREENSHOT_RAW"/navigation-log.txt "$SCREENSHOT_LOGS/" 2>/dev/null || true
          cp "$SCREENSHOT_RAW"/*hierarchy.txt "$SCREENSHOT_LOGS/" 2>/dev/null || true

          echo "Flattened $found image(s)."
          if [ "$found" -eq 0 ]; then
            echo "No screenshots were captured. The UI test log above explains why."
            exit 1
          fi

          echo "::group::independent cross-check with sips and file"
          for file in "$SCREENSHOT_OUT"/*.png; do
            echo "--- $(basename "$file")"
            sips -g pixelWidth -g pixelHeight -g hasAlpha -g format "$file"
            file "$file"
          done
          echo "::endgroup::"

          node scripts/verify-store-screenshots.mjs "$SCREENSHOT_OUT"

      - name: Summarise
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### iOS App Store screenshots"
            echo ""
            echo "- Simulator: \`${SIM_NAME:-unknown}\` (\`${SIM_UDID:-unknown}\`) on \`${SIM_RUNTIME:-unknown}\`"
            echo "- UI test step outcome: \`${{ steps.uitest.outcome }}\`"
            echo ""
            echo "| file | pixels | alpha |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          shopt -s nullglob
          for file in "$SCREENSHOT_OUT"/*.png; do
            w=$(sips -g pixelWidth "$file" | awk '/pixelWidth/{print $2}')
            h=$(sips -g pixelHeight "$file" | awk '/pixelHeight/{print $2}')
            a=$(sips -g hasAlpha "$file" | awk '/hasAlpha/{print $2}')
            echo "| $(basename "$file") | ${w}x${h} | ${a} |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-app-store-screenshots
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ env.SCREENSHOT_OUT }}
            ${{ env.SCREENSHOT_RAW }}
            ${{ env.SCREENSHOT_LOGS }}
